vmType: vz                  # Apple Virtualization.framework（高速）
mountType: virtiofs         # 高速ファイル共有
images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: aarch64
mounts:
  - location: "~/src"
    writable: true
  - location: "~/.claude/plugins"
    writable: true
  - location: "~"
    writable: false
    mountPoint: /host-home-readonly
memory: 4GiB
cpus: 4
provision:
  - mode: user
    script: |
      #!/bin/bash
      set -eu

      HOST_CLAUDE="/host-home-readonly/.claude"
      VM_CLAUDE="${HOME}/.claude"

      mkdir -p "${VM_CLAUDE}/scripts"

      # --- 1. plugins（専用RWマウント経由） ---
      ln -sfn /Users/saxsir/.claude/plugins "${VM_CLAUDE}/plugins"

      # --- 2. dotfilesリポジトリ経由のシンボリックリンク（~/src RWマウントで解決） ---
      for item in settings.json agents commands rules skills statusline-command.sh; do
        link_target=$(readlink "${HOST_CLAUDE}/${item}" 2>/dev/null || true)
        if [ -n "${link_target}" ]; then
          ln -sfn "${link_target}" "${VM_CLAUDE}/${item}"
        fi
      done

      # --- 3. scripts配下のシンボリックリンク ---
      for item in "${HOST_CLAUDE}/scripts/"*; do
        name=$(basename "${item}")
        link_target=$(readlink "${item}" 2>/dev/null || true)
        if [ -n "${link_target}" ]; then
          ln -sfn "${link_target}" "${VM_CLAUDE}/scripts/${name}"
        fi
      done

      # --- 4. CLAUDE.md（実ファイル、ROコピー） ---
      if [ -f "${HOST_CLAUDE}/CLAUDE.md" ]; then
        cp "${HOST_CLAUDE}/CLAUDE.md" "${VM_CLAUDE}/CLAUDE.md"
      fi

      # --- 5. settings.local.json（初回のみコピー、以降VM独自） ---
      if [ ! -f "${VM_CLAUDE}/settings.local.json" ] && [ -f "${HOST_CLAUDE}/settings.local.json" ]; then
        cp "${HOST_CLAUDE}/settings.local.json" "${VM_CLAUDE}/settings.local.json"
      fi

      echo "[provision] Claude Code setup complete"
